<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Carrot body gradient -->
    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFA033"/>
      <stop offset="50%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#E06800"/>
    </linearGradient>
    <!-- Leaf gradient -->
    <linearGradient id="lg" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#388E3C"/>
      <stop offset="100%" stop-color="#66BB6A"/>
    </linearGradient>
    <!-- Highlight gradient -->
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC266" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFC266" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Leaves (behind carrot) -->
  <!-- Left leaf -->
  <path d="M26 25 Q18 14 14 6 Q16 9 20 14 Q22 11 25 7 Q23 15 27 22Z"
        fill="url(#lg)" stroke="#2E7D32" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- Center leaf -->
  <path d="M31 23 Q28 10 30 3 Q32 7 33 3 Q35 10 33 23Z"
        fill="#5CB860" stroke="#2E7D32" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- Right leaf -->
  <path d="M38 25 Q46 14 50 6 Q48 9 44 14 Q42 11 39 7 Q41 15 37 22Z"
        fill="url(#lg)" stroke="#2E7D32" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- Tiny center leaf -->
  <path d="M30 24 Q29 18 27 14 Q31 17 32 14 Q33 17 37 14 Q35 18 34 24Z"
        fill="#4CAF50" stroke="#2E7D32" stroke-width="0.6" stroke-linejoin="round"/>

  <!-- Carrot body — organic tapered shape -->
  <path d="M22 26 Q20 28 21 33 Q22 40 26 47 Q29 53 32 59
           Q35 53 38 47 Q42 40 43 33 Q44 28 42 26
           Q37 22 32 21 Q27 22 22 26Z"
        fill="url(#cg)" stroke="#CC6600" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Highlight (left side shine) -->
  <path d="M25 28 Q24 30 25 36 Q27 43 30 50
           Q28 43 26 36 Q24 31 25 28Z"
        fill="url(#hg)" stroke="none"/>

  <!-- Horizontal groove lines -->
  <path d="M25 32 Q32 30 39 32" fill="none" stroke="#CC6600" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>
  <path d="M26 38 Q32 36 38 38" fill="none" stroke="#CC6600" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
  <path d="M28 44 Q32 42.5 36 44" fill="none" stroke="#CC6600" stroke-width="0.7" stroke-linecap="round" opacity="0.35"/>
  <path d="M30 50 Q32 49 34 50" fill="none" stroke="#CC6600" stroke-width="0.6" stroke-linecap="round" opacity="0.3"/>

  <!-- Leaf center vein lines -->
  <line x1="20" y1="11" x2="26" y2="23" stroke="#2E7D32" stroke-width="0.5" opacity="0.5"/>
  <line x1="31.5" y1="6" x2="32" y2="22" stroke="#2E7D32" stroke-width="0.5" opacity="0.5"/>
  <line x1="44" y1="11" x2="38" y2="23" stroke="#2E7D32" stroke-width="0.5" opacity="0.5"/>
</svg>
