<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spring practice</title><style>body{margin:0;background:#332b25;color:#fff3d5;font:14px system-ui}header{padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}button{font:inherit;padding:6px 10px}iframe{border:0;width:100%;height:calc(100vh - 60px);display:block}</style></head><body>
<header><span>Spring practice · A/D move · W jump · S fast stomp</span><button id="reset" type="button">Back to spring</button><span id="status" role="status">Loading…</span></header>
<iframe id="game" title="Live game spring practice" src="../../../?arena=meadow&amp;bots=0&amp;simWorker=off&amp;killLimit=100"></iframe>
<script>
const frame=document.getElementById('game'),status=document.getElementById('status');
function seed(){
  const win=frame.contentWindow,s=win.__bunnyTest?.state();if(!s||s.countdown!==0||s.phase!=='playing')return false;
  const p=s.players.find(p=>p.id==='P1');if(!p)return false;
  for(const other of s.players)if(other!==p)other.active=false;
  s.springs=[{x:806,y:660,life:3600,growTimer:0,bounceTimer:0}];s.springSpawnTimer=3600;s.thornSpawnTimer=3600;s.thorns=[];
  p.x=790;p.y=660-p.height-26;p.vx=0;p.vy=80;p.state='airborne';p.fastFalling=false;p.springTrailTimer=0;
  p.splatTimer=0;p.respawnTimer=0;p.active=true;
  win.__bunnyTest.gameLoop().resetCosmeticBaselines();
  status.textContent='Live spring collision · main simulation / renderer worker';frame.focus();return true;
}
document.getElementById('reset').onclick=seed;
const ready=setInterval(()=>{if(seed())clearInterval(ready)},100);
</script></body></html>
