<div id="spring-study">
  <h2>Spring bounce</h2>
  <div class="viz-controls">
    <button class="btn" type="button" id="spring-play">Pause</button>
    <label class="form-label">Speed <select class="form-select" id="spring-speed"><option value="1">Normal</option><option value="0.35">Slow motion</option></select></label>
    <label class="form-label">Scale <select class="form-select" id="spring-scale"><option value="1">Game size</option><option value="2">2× detail</option></select></label>
    <label class="form-check"><input class="form-check-input" id="spring-night" type="checkbox"><span class="form-check-label">Night</span></label>
    <label class="form-check"><input class="form-check-input" id="spring-baseline" type="checkbox"><span class="form-check-label">Current effect</span></label>
  </div>
  <label class="form-label" for="spring-time">Launch timing</label>
  <input class="form-range" id="spring-time" type="range" min="0" max="1.25" step="0.005" value="0">
  <div class="spring-panels">
    <section><h3>Coiled ink trail</h3><canvas aria-label="Bunny spring launch with a short expanding ink coil" role="img"></canvas><label class="form-check"><input class="form-check-input" type="radio" name="spring-choice" value="Coiled ink trail"><span class="form-check-label">Coiled ink trail</span></label></section>
    <section><h3>Cloud burst</h3><canvas aria-label="Bunny spring launch with a compact cream cloud burst" role="img"></canvas><label class="form-check"><input class="form-check-input" type="radio" name="spring-choice" value="Cloud burst"><span class="form-check-label">Cloud burst</span></label></section>
    <section><h3>Boing accents</h3><canvas aria-label="Bunny spring launch with short irregular ink accents" role="img"></canvas><label class="form-check"><input class="form-check-input" type="radio" name="spring-choice" value="Boing accents"><span class="form-check-label">Boing accents</span></label></section>
  </div>
</div>
<style>
  #spring-study .spring-panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  #spring-study canvas{display:block;width:100%;height:260px}
  @media(max-width:560px){#spring-study .spring-panels{grid-template-columns:1fr}}
</style>
<script>
(() => {
  const root=document.getElementById('spring-study');
  const atlas=new Image();atlas.src='__ATLAS__';
  const backdrop=new Image();backdrop.src='__BACKDROP__';
  /*__RENDERERS__*/
  const play=root.querySelector('#spring-play'),speed=root.querySelector('#spring-speed'),scale=root.querySelector('#spring-scale'),night=root.querySelector('#spring-night'),baseline=root.querySelector('#spring-baseline'),scrub=root.querySelector('#spring-time');
  const canvases=[...root.querySelectorAll('canvas')];
  let time=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,last=0;
  play.textContent=playing?'Pause':'Play';
  function save(){const choice=root.querySelector('input[name="spring-choice"]:checked')?.value;window.openai?.setWidgetState?.({modelContent:{spring:choice||null},privateContent:{time,playing,speed:speed.value,scale:scale.value,night:night.checked,baseline:baseline.checked}})?.catch(()=>{});}
  function restore(state){if(!state)return;const p=state.privateContent||{};if(Number.isFinite(p.time))time=p.time;if(typeof p.playing==='boolean')playing=p.playing;if(p.speed)speed.value=p.speed;if(p.scale)scale.value=p.scale;night.checked=!!p.night;baseline.checked=!!p.baseline;for(const radio of root.querySelectorAll('input[name="spring-choice"]'))radio.checked=radio.value===state.modelContent?.spring;play.textContent=playing?'Pause':'Play';}
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
  play.onclick=()=>{playing=!playing;play.textContent=playing?'Pause':'Play';save()};
  scrub.oninput=()=>{time=Number(scrub.value);playing=false;play.textContent='Play';draw();save()};
  for(const el of [speed,scale,night,baseline,...root.querySelectorAll('input[name="spring-choice"]')])el.onchange=()=>{draw();save()};
  function draw(){
    scrub.value=String(time);
    canvases.forEach((canvas,index)=>{
      const z=Number(scale.value),h=z===2?490:260;canvas.style.height=h+'px';
      const w=canvas.clientWidth,dpr=Math.min(devicePixelRatio||1,2);
      if(canvas.width!==Math.round(w*dpr)||canvas.height!==h*dpr){canvas.width=Math.round(w*dpr);canvas.height=h*dpr;}
      const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
      ctx.fillStyle=night.checked?'#334451':'#ACD5DE';ctx.fillRect(0,0,w,h);
      if(backdrop.naturalWidth){ctx.globalAlpha=night.checked?.22:.6;ctx.drawImage(backdrop,230,240,480,300,0,0,w,h);ctx.globalAlpha=1;}
      ctx.save();ctx.translate(w/2,h-18);ctx.scale(z,z);
      ctx.fillStyle=night.checked?'#627958':'#9FB875';ctx.strokeStyle='#665344';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-w/z,0);ctx.quadraticCurveTo(-25,-2,5,0);ctx.lineTo(w/z,0);ctx.lineTo(w/z,20);ctx.lineTo(-w/z,20);ctx.closePath();ctx.fill();ctx.stroke();
      const age=time-.18;
      drawSpringMushroom(ctx,{x:0,y:0,bounceTimer:age>=0&&age<.2?.2-age:0,growTimer:0,life:10},{});
      if(age>=0){if(baseline.checked){drawSpringTrail(ctx,{springTrailTimer:Math.max(0,.35-age),springLaunchX:0,springLaunchY:0},age*1000);}else drawSpringVariant(ctx,index,age);}
      const flight=Math.max(0,age),rise=age>=0?Math.max(0,Math.min(178,700*flight-850*flight*flight)):0;
      const feet=-37-rise;
      if(atlas.naturalWidth){const pose=age<0?0:age<.09?3:age<.4?2:age<.64?4:0;ctx.drawImage(atlas,(pose%4)*96,Math.floor(pose/4)*96,96,96,-20,feet-40,40,40);}
      ctx.restore();
    });
  }
  new ResizeObserver(draw).observe(root);atlas.onload=draw;backdrop.onload=draw;
  function frame(now){if(playing)time=(time+Math.min(.05,(now-last)/1000)*Number(speed.value))%1.25;last=now;draw();requestAnimationFrame(frame)}
  draw();requestAnimationFrame(frame);
})();
</script>
