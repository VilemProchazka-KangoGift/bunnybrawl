<div id="bump-study">
  <h2>Player bumps</h2>
  <div class="viz-controls">
    <button class="btn" type="button" id="bump-play">Pause</button>
    <label class="form-label">Speed <select class="form-select" id="bump-speed"><option value="1">Normal</option><option value="0.35">Slow motion</option></select></label>
    <label class="form-label">Scale <select class="form-select" id="bump-scale"><option value="1">Game size</option><option value="2">2× detail</option></select></label>
    <label class="form-check"><input class="form-check-input" id="bump-night" type="checkbox"><span class="form-check-label">Night</span></label>
    <label class="form-check"><input class="form-check-input" id="bump-baseline" type="checkbox"><span class="form-check-label">Current reaction</span></label>
  </div>
  <label class="form-label" for="bump-time">Contact timing</label>
  <input class="form-range" id="bump-time" type="range" min="0" max="1.1" step="0.005" value="0">
  <div class="bump-panels">
    <section><h3>Stronger squash</h3><canvas aria-label="Two bunnies collide with a stronger body squash" role="img"></canvas><label class="form-check"><input class="form-check-input" type="radio" name="bump-choice" value="Stronger squash"><span class="form-check-label">Stronger squash</span></label></section>
    <section><h3>Contact flash</h3><canvas aria-label="Two bunnies collide with a tiny irregular contact flash" role="img"></canvas><label class="form-check"><input class="form-check-input" type="radio" name="bump-choice" value="Contact flash"><span class="form-check-label">Contact flash</span></label></section>
    <section><h3>Short recoil</h3><canvas aria-label="Two bunnies collide with a short outward pose recoil" role="img"></canvas><label class="form-check"><input class="form-check-input" type="radio" name="bump-choice" value="Short recoil"><span class="form-check-label">Short recoil</span></label></section>
  </div>
</div>
<style>
  #bump-study .bump-panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  #bump-study canvas{display:block;width:100%;height:180px}
  @media(max-width:560px){#bump-study .bump-panels{grid-template-columns:1fr}}
</style>
<script>
(() => {
  const root=document.getElementById('bump-study');
  const atlas=new Image();atlas.src='__ATLAS__';
  const backdrop=new Image();backdrop.src='__BACKDROP__';
  /*__VARIANTS__*/
  const play=root.querySelector('#bump-play'),speed=root.querySelector('#bump-speed'),scale=root.querySelector('#bump-scale'),night=root.querySelector('#bump-night'),baseline=root.querySelector('#bump-baseline'),scrub=root.querySelector('#bump-time');
  const canvases=[...root.querySelectorAll('canvas')];
  let time=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,last=0;
  function save(){const choice=root.querySelector('input[name="bump-choice"]:checked')?.value;window.openai?.setWidgetState?.({modelContent:{playerBump:choice||null},privateContent:{time,playing,speed:speed.value,scale:scale.value,night:night.checked,baseline:baseline.checked}})?.catch(()=>{});}
  function restore(state){if(!state)return;const p=state.privateContent||{};if(Number.isFinite(p.time))time=p.time;if(typeof p.playing==='boolean')playing=p.playing;for(const [name,el] of [['speed',speed],['scale',scale]])if(p[name])el.value=p[name];night.checked=!!p.night;baseline.checked=!!p.baseline;for(const radio of root.querySelectorAll('input[name="bump-choice"]'))radio.checked=radio.value===state.modelContent?.playerBump;play.textContent=playing?'Pause':'Play';}
  restore(window.openai?.widgetState);play.textContent=playing?'Pause':'Play';
  window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
  play.onclick=()=>{playing=!playing;play.textContent=playing?'Pause':'Play';save()};
  scrub.oninput=()=>{time=Number(scrub.value);playing=false;play.textContent='Play';draw();save()};
  for(const el of [speed,scale,night,baseline,...root.querySelectorAll('input[name="bump-choice"]')])el.onchange=()=>{draw();save()};
  function draw(){
    scrub.value=String(time);
    canvases.forEach((canvas,index)=>{
      const z=Number(scale.value),h=z===2?260:180;canvas.style.height=h+'px';
      const w=canvas.clientWidth,dpr=Math.min(devicePixelRatio||1,2);
      if(canvas.width!==Math.round(w*dpr)||canvas.height!==h*dpr){canvas.width=Math.round(w*dpr);canvas.height=h*dpr;}
      const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
      ctx.fillStyle=night.checked?'#334451':'#ACD5DE';ctx.fillRect(0,0,w,h);
      if(backdrop.naturalWidth){ctx.globalAlpha=night.checked?.22:.6;ctx.drawImage(backdrop,230,240,480,300,0,0,w,h);ctx.globalAlpha=1;}
      ctx.save();ctx.translate(w/2,h-20);ctx.scale(z,z);
      ctx.fillStyle=night.checked?'#627958':'#9FB875';ctx.fillRect(-w/z,0,w*2/z,24);
      ctx.strokeStyle='#665344';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-w/z,0);ctx.lineTo(w/z,0);ctx.stroke();
      drawBumpScene(ctx,atlas,time,index,baseline.checked);
      ctx.restore();
    });
  }
  new ResizeObserver(draw).observe(root);atlas.onload=draw;backdrop.onload=draw;
  function frame(now){if(playing)time=(time+Math.min(.05,(now-last)/1000)*Number(speed.value))%1.1;last=now;draw();requestAnimationFrame(frame)}
  draw();requestAnimationFrame(frame);
})();
</script>
