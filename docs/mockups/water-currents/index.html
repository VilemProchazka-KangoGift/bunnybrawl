<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geyser comparisons</title>
<style>body{font:14px system-ui;max-width:1320px;margin:20px auto;padding:0 16px;background:#faf8f3;color:#332b25}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}button,select{font:inherit;padding:8px}.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panels.focus{grid-template-columns:1fr}canvas{display:block;width:100%;aspect-ratio:16/9}section[hidden]{display:none}input[type=range]{width:100%}h3{margin-bottom:4px}@media(max-width:700px){.panels{grid-template-columns:1fr}}</style>
<body><h2>Water currents</h2><p>Compare directional water flow at its actual gameplay size.</p>
<div class="controls"><button id="play">Pause</button><button id="replay">Replay</button><label>Arena <select id="arena"><option value="waterfall">Waterfall</option><option value="underwater">Underwater</option></select></label><label>Playback <select id="speed"><option value="1">Normal</option><option value=".25">Slow motion</option></select></label><label>View <select id="view"><option value="all">All comparisons</option><option value="0">Current</option><option value="1">Layered flowing ribbons</option><option value="2">Foam streaks</option><option value="3">Bubble lanes</option></select></label></div>
<label for="time">Timeline <span id="clock"></span></label><input id="time" type="range" min="0" max="8" step=".001" value="0">
<div class="panels"><section><h3>Current</h3><canvas></canvas></section><section><h3>Layered flowing ribbons</h3><canvas></canvas></section><section><h3>Foam streaks</h3><canvas></canvas></section><section><h3>Bubble lanes</h3><canvas></canvas></section></div>
<p>Production renderer and actual current bounds. Alternatives show water before players; physics and sound are omitted. Production is unchanged.</p><p id="status">Loading…</p><script type="module" src="./study.js"></script></body></html>
