<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wall bonk variations</title><style>body{font:14px system-ui;margin:20px auto;padding:0 16px;max-width:1000px;background:#faf8f3;color:#332b25}.viz-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.form-label,.form-check{display:inline-flex;gap:6px;align-items:center}button,select{font:inherit;padding:8px}input[type=range]{width:100%}h2{font-size:21px}h3{font-size:15px}</style></head><body><div id="bonk-study">
  <h2>Wall bonk</h2>
  <div class="viz-controls">
    <button class="btn" type="button" id="bonk-play">Pause</button>
    <label class="form-label">Speed <select class="form-select" id="bonk-speed"><option value="1">Normal</option><option value="0.35">Slow motion</option></select></label>
    <label class="form-label">Scale <select class="form-select" id="bonk-scale"><option value="1">Game size</option><option value="2">2× detail</option></select></label>
    <label class="form-label">Side <select class="form-select" id="bonk-side"><option value="1">Right wall</option><option value="-1">Left wall</option></select></label>
    <label class="form-check"><input class="form-check-input" id="bonk-night" type="checkbox"><span class="form-check-label">Night</span></label>
    <label class="form-check"><input class="form-check-input" id="bonk-baseline" type="checkbox"><span class="form-check-label">Current reaction</span></label>
  </div>
  <label class="form-label" for="bonk-time">Contact timing</label>
  <input class="form-range" id="bonk-time" type="range" min="0" max="1.1" step="0.005" value="0">
  <div class="bonk-panels">
    <section><h3>Contact ticks</h3><canvas aria-label="Running Bunny hits a wall with short irregular contact ticks" role="img"></canvas><label class="form-check"><input class="form-check-input" type="radio" name="bonk-choice" value="Contact ticks"><span class="form-check-label">Contact ticks</span></label></section>
    <section><h3>Star pop</h3><canvas aria-label="Running Bunny hits a wall with a small inked star pop" role="img"></canvas><label class="form-check"><input class="form-check-input" type="radio" name="bonk-choice" value="Star pop"><span class="form-check-label">Star pop</span></label></section>
    <section><h3>Squash only</h3><canvas aria-label="Running Bunny hits a wall with a stronger body squash and no added graphic" role="img"></canvas><label class="form-check"><input class="form-check-input" type="radio" name="bonk-choice" value="Squash only"><span class="form-check-label">Squash only</span></label></section>
  </div>
</div>
<style>
  #bonk-study .bonk-panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  #bonk-study canvas{display:block;width:100%;height:180px}
  @media(max-width:560px){#bonk-study .bonk-panels{grid-template-columns:1fr}}
</style>

  // Design studies only. Both graphics accompany the existing .75 body squash.
function drawBonkVariant(ctx, variant, x, y, age) {
  const duration=variant===0?.14:.16;
  if(variant===2||age<0||age>=duration)return;
  const t=age/duration;
  ctx.save();ctx.translate(x,y);ctx.globalAlpha=(1-t)**.8;
  ctx.strokeStyle='#665344';ctx.fillStyle='#FFF3D5';ctx.lineWidth=1.1;
  ctx.lineJoin='round';
  if(variant===0){
    const angles=[-2.2,Math.PI,2.12],lengths=[13,10,15];
    for(let i=0;i<3;i++){
      const a=angles[i],start=5+t*3,end=lengths[i]+t*3;
      const ux=Math.cos(a),uy=Math.sin(a),nx=-uy,ny=ux;
      ctx.beginPath();ctx.moveTo(ux*start+nx,uy*start+ny);
      ctx.lineTo(ux*end+nx*.5,uy*end+ny*.5);
      ctx.lineTo(ux*(end+1)-nx*.8,uy*(end+1)-ny*.8);
      ctx.lineTo(ux*(start+1)-nx*1.5,uy*(start+1)-ny*1.5);
      ctx.closePath();ctx.fill();ctx.stroke();
    }
  }else{
    const r=9*(1+.12*t);
    ctx.beginPath();ctx.moveTo(-r*.94,-r*.1);
    ctx.lineTo(-r*.35,-r*.42);ctx.lineTo(-r*.31,-r*1.05);
    ctx.lineTo(r*.13,-r*.48);ctx.lineTo(r*.8,-r*.73);
    ctx.lineTo(r*.49,-r*.04);ctx.lineTo(r*.98,r*.38);
    ctx.lineTo(r*.28,r*.46);ctx.lineTo(r*.02,r*.96);
    ctx.lineTo(-r*.24,r*.39);ctx.lineTo(-r*.84,r*.57);
    ctx.lineTo(-r*.54,r*.07);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#F2B653';ctx.beginPath();ctx.moveTo(-4,0);
    ctx.lineTo(-1,-4);ctx.lineTo(2,-1);ctx.lineTo(5,1);ctx.lineTo(0,4);ctx.closePath();ctx.fill();
    ctx.fillStyle='#FFF3D5';
    ctx.beginPath();ctx.moveTo(-12-t*3,-10);ctx.lineTo(-14-t*3,-15);
    ctx.lineTo(-10-t*3,-13);ctx.closePath();ctx.fill();ctx.stroke();
  }
  ctx.restore();
}

function drawStudyWall(ctx,width,night){
  const ink='#665344';
  ctx.fillStyle=night?'#627958':'#9FB875';ctx.fillRect(-width,0,width*2,24);
  ctx.strokeStyle=ink;ctx.lineWidth=1.1;ctx.beginPath();ctx.moveTo(-width,0);ctx.lineTo(width,0);ctx.stroke();
  // Small illustrated platform face; geometry is fixed across every option.
  ctx.fillStyle=night?'#745641':'#AD7953';ctx.beginPath();ctx.moveTo(40,-80);
  ctx.lineTo(width,-80);ctx.lineTo(width,0);ctx.lineTo(40,0);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle=night?'#88704D':'#CDA367';ctx.beginPath();ctx.moveTo(36,-84);
  ctx.lineTo(width,-84);ctx.lineTo(width,-73);ctx.lineTo(36,-73);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.strokeStyle=night?'#57483A':'#7A533B';ctx.lineWidth=.8;
  for(let i=0;i<4;i++){
    const x=48+i*17;ctx.beginPath();ctx.moveTo(x,-65);
    ctx.bezierCurveTo(x+5,-51,x-4,-27,x+2,-8);ctx.stroke();
  }
  ctx.fillStyle=night?'#6C805A':'#A6BC78';ctx.beginPath();ctx.moveTo(36,-84);
  ctx.lineTo(47,-89);ctx.lineTo(70,-87);ctx.lineTo(90,-89);ctx.lineTo(width,-87);
  ctx.lineTo(width,-80);ctx.lineTo(37,-79);ctx.closePath();ctx.fill();ctx.stroke();
}

      const pulse=age>=0&&age<.19?Math.max(0,1-age/.19):0;
      const squash=1-pulse*(index===2&&!baseline.checked?.38:.25);
      ctx.save();ctx.translate(center,-20);ctx.scale(squash,1+(1-squash)*.4);
      if(atlas.naturalWidth){const pose=age<0?1:0;ctx.drawImage(atlas,(pose%4)*96,Math.floor(pose/4)*96,96,96,-20,-20,40,40);}
      ctx.restore();
      if(!baseline.checked)drawBonkVariant(ctx,index,40,-20,age);
      ctx.restore();
    });
  }
  new ResizeObserver(draw).observe(root);atlas.onload=draw;backdrop.onload=draw;
  function frame(now){if(playing)time=(time+Math.min(.05,(now-last)/1000)*Number(speed.value))%1.1;last=now;draw();requestAnimationFrame(frame)}
  draw();requestAnimationFrame(frame);
})();
</script>
