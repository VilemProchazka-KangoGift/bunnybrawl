<div id="bonk-study">
  <h2>Wall bonk</h2>
  <div class="viz-controls">
    <button class="btn" type="button" id="bonk-play">Pause</button>
    <label class="form-label">Speed <select class="form-select" id="bonk-speed"><option value="1">Normal</option><option value="0.35">Slow motion</option></select></label>
    <label class="form-label">Scale <select class="form-select" id="bonk-scale"><option value="1">Game size</option><option value="2">2× detail</option></select></label>
    <label class="form-label">Side <select class="form-select" id="bonk-side"><option value="1">Right wall</option><option value="-1">Left wall</option></select></label>
    <label class="form-check"><input class="form-check-input" id="bonk-night" type="checkbox"><span class="form-check-label">Night</span></label>
    <label class="form-check"><input class="form-check-input" id="bonk-baseline" type="checkbox"><span class="form-check-label">Current reaction</span></label>
  </div>
  <label class="form-label" for="bonk-time">Contact timing</label>
  <input class="form-range" id="bonk-time" type="range" min="0" max="1.1" step="0.005" value="0">
  <div class="bonk-panels">
    <section><h3>Contact ticks</h3><canvas aria-label="Running Bunny hits a wall with short irregular contact ticks" role="img"></canvas><label class="form-check"><input class="form-check-input" type="radio" name="bonk-choice" value="Contact ticks"><span class="form-check-label">Contact ticks</span></label></section>
    <section><h3>Star pop</h3><canvas aria-label="Running Bunny hits a wall with a small inked star pop" role="img"></canvas><label class="form-check"><input class="form-check-input" type="radio" name="bonk-choice" value="Star pop"><span class="form-check-label">Star pop</span></label></section>
    <section><h3>Squash only</h3><canvas aria-label="Running Bunny hits a wall with a stronger body squash and no added graphic" role="img"></canvas><label class="form-check"><input class="form-check-input" type="radio" name="bonk-choice" value="Squash only"><span class="form-check-label">Squash only</span></label></section>
  </div>
</div>
<style>
  #bonk-study .bonk-panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  #bonk-study canvas{display:block;width:100%;height:180px}
  @media(max-width:560px){#bonk-study .bonk-panels{grid-template-columns:1fr}}
</style>
<script>
(() => {
  const root=document.getElementById('bonk-study');
  const atlas=new Image();atlas.src='__ATLAS__';
  const backdrop=new Image();backdrop.src='__BACKDROP__';
  /*__VARIANTS__*/
  const play=root.querySelector('#bonk-play'),speed=root.querySelector('#bonk-speed'),scale=root.querySelector('#bonk-scale'),side=root.querySelector('#bonk-side'),night=root.querySelector('#bonk-night'),baseline=root.querySelector('#bonk-baseline'),scrub=root.querySelector('#bonk-time');
  const canvases=[...root.querySelectorAll('canvas')];
  let time=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,last=0;
  function save(){const choice=root.querySelector('input[name="bonk-choice"]:checked')?.value;window.openai?.setWidgetState?.({modelContent:{wallBonk:choice||null},privateContent:{time,playing,speed:speed.value,scale:scale.value,side:side.value,night:night.checked,baseline:baseline.checked}})?.catch(()=>{});}
  function restore(state){if(!state)return;const p=state.privateContent||{};if(Number.isFinite(p.time))time=p.time;if(typeof p.playing==='boolean')playing=p.playing;for(const [name,el] of [['speed',speed],['scale',scale],['side',side]])if(p[name])el.value=p[name];night.checked=!!p.night;baseline.checked=!!p.baseline;for(const radio of root.querySelectorAll('input[name="bonk-choice"]'))radio.checked=radio.value===state.modelContent?.wallBonk;play.textContent=playing?'Pause':'Play';}
  restore(window.openai?.widgetState);play.textContent=playing?'Pause':'Play';
  window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
  play.onclick=()=>{playing=!playing;play.textContent=playing?'Pause':'Play';save()};
  scrub.oninput=()=>{time=Number(scrub.value);playing=false;play.textContent='Play';draw();save()};
  for(const el of [speed,scale,side,night,baseline,...root.querySelectorAll('input[name="bonk-choice"]')])el.onchange=()=>{draw();save()};
  function draw(){
    scrub.value=String(time);
    canvases.forEach((canvas,index)=>{
      const z=Number(scale.value),h=z===2?260:180;canvas.style.height=h+'px';
      const w=canvas.clientWidth,dpr=Math.min(devicePixelRatio||1,2);
      if(canvas.width!==Math.round(w*dpr)||canvas.height!==h*dpr){canvas.width=Math.round(w*dpr);canvas.height=h*dpr;}
      const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
      ctx.fillStyle=night.checked?'#334451':'#ACD5DE';ctx.fillRect(0,0,w,h);
      if(backdrop.naturalWidth){ctx.globalAlpha=night.checked?.22:.6;ctx.drawImage(backdrop,230,240,480,300,0,0,w,h);ctx.globalAlpha=1;}
      ctx.save();ctx.translate(w/2,h-20);ctx.scale(z*Number(side.value),z);
      drawStudyWall(ctx,w/z,night.checked);
      const age=time-.4;
      const center=age<0?-68+92*(time/.4):24;
      const pulse=age>=0&&age<.19?Math.max(0,1-age/.19):0;
      const squash=1-pulse*(index===2&&!baseline.checked?.38:.25);
      ctx.save();ctx.translate(center,-20);ctx.scale(squash,1+(1-squash)*.4);
      if(atlas.naturalWidth){const pose=age<0?1:0;ctx.drawImage(atlas,(pose%4)*96,Math.floor(pose/4)*96,96,96,-20,-20,40,40);}
      ctx.restore();
      if(!baseline.checked)drawBonkVariant(ctx,index,40,-20,age);
      ctx.restore();
    });
  }
  new ResizeObserver(draw).observe(root);atlas.onload=draw;backdrop.onload=draw;
  function frame(now){if(playing)time=(time+Math.min(.05,(now-last)/1000)*Number(speed.value))%1.1;last=now;draw();requestAnimationFrame(frame)}
  draw();requestAnimationFrame(frame);
})();
</script>
