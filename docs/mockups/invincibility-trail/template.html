<div id="trail-study">
  <h2>Invincibility trail</h2>
  <p>Protection begins at 0.1s and ends at 1.6s. Every option keeps the current 100ms half-opacity blink. No footstep puffs.</p>
  <div class="viz-controls">
    <label class="form-label">Character <select class="form-select" id="trail-character"></select></label>
    <label class="form-label">Run speed <select id="trail-velocity"><option value="280">280 px/s · full speed</option><option value="0">Standing still</option><option value="160">160 px/s · slow run</option></select></label>
    <label class="form-check"><input id="trail-left" type="checkbox">Left</label>
    <label class="form-label">Surface <select class="form-select" id="trail-surface"><option>grass</option><option>stone</option><option>wood</option><option>snow</option><option>sand</option><option>ice</option><option>metal</option><option>glass</option></select></label>
    <button class="btn" type="button" id="trail-play">Pause</button>
    <label class="form-label">Speed <select class="form-select" id="trail-speed"><option value="1">Normal</option><option value="0.35">Slow motion</option></select></label>
    <label class="form-label">Scale <select class="form-select" id="trail-scale"><option value="1">Game size</option><option value="2">2× detail</option></select></label>
    <label class="form-check"><input class="form-check-input" id="trail-night" type="checkbox"><span class="form-check-label">Night</span></label>
  </div>
  <label class="form-label" for="trail-time">Protection timing</label>
  <input class="form-range" id="trail-time" type="range" min="0" max="3.2" step="0.005" value="0">
  <div class="trail-panels"><section><h3>Current blue ovals</h3><canvas role="img"></canvas><label class="form-check"><input type="radio" name="trail-choice" value="Current blue ovals">Current blue ovals</label></section>
<section><h3>Blue irregular clouds</h3><canvas role="img"></canvas><label class="form-check"><input type="radio" name="trail-choice" value="Blue irregular clouds">Blue irregular clouds</label></section>
<section><h3>Small shield sparks</h3><canvas role="img"></canvas><label class="form-check"><input type="radio" name="trail-choice" value="Small shield sparks">Small shield sparks</label></section>
<section><h3>Blinking only</h3><canvas role="img"></canvas><label class="form-check"><input type="radio" name="trail-choice" value="Blinking only">Blinking only</label></section>
  </div>
</div>
<style>
  #trail-study .trail-panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  #trail-study canvas{display:block;width:100%;height:220px}
  @media(max-width:560px){#trail-study .trail-panels{grid-template-columns:1fr}}
</style>
<script>
(() => {
  const root=document.getElementById('trail-study');
  const characterSources=__CHARACTERS__;
  const characterImages=Object.fromEntries(Object.entries(characterSources).map(([name,src])=>{const image=new Image();image.src=src;return [name,image]}));
  const backdrop=new Image();backdrop.src='__BACKDROP__';
  /*__VARIANTS__*/
  const play=root.querySelector('#trail-play'),speed=root.querySelector('#trail-speed'),scale=root.querySelector('#trail-scale'),night=root.querySelector('#trail-night'),scrub=root.querySelector('#trail-time');
  const velocity=root.querySelector('#trail-velocity'),left=root.querySelector('#trail-left');
  const surface=root.querySelector('#trail-surface');
  const canvases=[...root.querySelectorAll('canvas')];
  const character=root.querySelector('#trail-character');
  for(const name of Object.keys(characterSources)){const option=document.createElement('option');option.value=name;option.textContent=name;character.append(option)}
  let time=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,last=0;
  function save(){const choice=root.querySelector('input[name="trail-choice"]:checked')?.value;window.openai?.setWidgetState?.({modelContent:{running:choice||null,character:character.value},privateContent:{character:character.value,time,playing,speed:speed.value,scale:scale.value,surface:surface.value,night:night.checked}})?.catch(()=>{});}
  function restore(state){if(!state)return;const p=state.privateContent||{};if(characterImages[p.character])character.value=p.character;if(Number.isFinite(p.time))time=p.time;if(typeof p.playing==='boolean')playing=p.playing;for(const [name,el] of [['speed',speed],['scale',scale]])if(p[name])el.value=p[name];night.checked=!!p.night;if(p.surface)surface.value=p.surface;for(const radio of root.querySelectorAll('input[name="trail-choice"]'))radio.checked=radio.value===state.modelContent?.running;play.textContent=playing?'Pause':'Play';}
  restore(window.openai?.widgetState);play.textContent=playing?'Pause':'Play';
  window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState));
  play.onclick=()=>{playing=!playing;play.textContent=playing?'Pause':'Play';save()};
  scrub.oninput=()=>{time=Number(scrub.value);playing=false;play.textContent='Play';draw();save()};
  for(const el of [velocity,left,surface,character,speed,scale,night,...root.querySelectorAll('input[name="trail-choice"]')])el.onchange=()=>{draw();save()};
  function draw(){
    scrub.value=String(time);
    canvases.forEach((canvas,index)=>{
      const z=Number(scale.value),h=z===2?340:220;canvas.style.height=h+'px';
      const w=canvas.clientWidth,dpr=Math.min(devicePixelRatio||1,2);
      if(canvas.width!==Math.round(w*dpr)||canvas.height!==h*dpr){canvas.width=Math.round(w*dpr);canvas.height=h*dpr;}
      const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
      ctx.fillStyle=night.checked?'#334451':'#ACD5DE';ctx.fillRect(0,0,w,h);
      if(backdrop.naturalWidth){ctx.globalAlpha=night.checked?.22:.6;ctx.drawImage(backdrop,230,240,480,300,0,0,w,h);ctx.globalAlpha=1;}
      ctx.save();ctx.translate(w/2,h-20);ctx.scale(z,z);
      ctx.fillStyle=surfaceGround[surface.value];ctx.fillRect(-w/z,0,w*2/z,24);
      ctx.strokeStyle='#665344';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-w/z,0);ctx.lineTo(w/z,0);ctx.stroke();
      canvas.dataset.hit=String(time>=.4);
      canvas.setAttribute('aria-label',character.value+' running: '+canvas.parentElement.querySelector('h3').textContent+(time>=.1?', running':', ready'));
      drawProtectionScene(ctx,characterImages[character.value],character.value,time,index,surface.value,w/z,Number(velocity.value),left.checked);
      ctx.restore();
    });
  }
  new ResizeObserver(draw).observe(root);for(const image of Object.values(characterImages))image.onload=draw;backdrop.onload=draw;
  function frame(now){if(playing)time=(time+Math.min(.05,(now-last)/1000)*Number(speed.value))%3.2;last=now;draw();requestAnimationFrame(frame)}
  draw();requestAnimationFrame(frame);
})();
</script>
