<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lobby birds comparisons</title>
<style>body{font:14px system-ui;max-width:1320px;margin:20px auto;padding:0 16px;background:#faf8f3;color:#332b25}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}button,select{font:inherit;padding:8px}.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panels.focus{grid-template-columns:1fr}canvas{display:block;width:100%;aspect-ratio:16/9}.detail{aspect-ratio:320/56;background:#30212a;border-radius:4px;margin-top:6px}section[hidden]{display:none}input[type=range]{width:100%}h3{margin-bottom:4px}@media(max-width:700px){.panels{grid-template-columns:1fr}}</style>
<body><h2>Lobby birds</h2><p>Compare two birds on matched flight paths. Four rounded ink butterflies stay in every panel.</p>
<div class="controls"><label>Bird size <select id="bird-size"><option value="2">2× visibility preview</option><option value="1">Original game size</option></select></label><label>Lighting <select id="lighting"><option value="0">Day</option><option value="0.5">Night</option></select></label><button id="play">Pause</button><button id="replay">Replay</button><label>Playback <select id="speed"><option value="1">Normal</option><option value=".25">Slow motion</option></select></label><label>View <select id="view"><option value="all">All comparisons</option><option value="0">Current silhouettes</option><option value="1">Rounded swallows</option><option value="2">Swept ink wings</option><option value="3">No birds</option></select></label></div>
<label for="time">Timeline <span id="clock"></span></label><input id="time" type="range" min="0" max="8" step=".001" value="0">
<div class="panels"><section><h3>Current silhouettes</h3><canvas class="scene"></canvas><canvas class="detail" width="320" height="56" aria-label="Bird close-up at three times game size"></canvas></section><section><h3>Rounded swallows</h3><canvas class="scene"></canvas><canvas class="detail" width="320" height="56" aria-label="Bird close-up at three times game size"></canvas></section><section><h3>Swept ink wings</h3><canvas class="scene"></canvas><canvas class="detail" width="320" height="56" aria-label="Bird close-up at three times game size"></canvas></section><section><h3>No birds</h3><canvas class="scene"></canvas><canvas class="detail" width="320" height="56" aria-label="Bird close-up at three times game size"></canvas></section></div>
<p>Scripted weather and character motion. Production is unchanged.</p><p id="status">Loading…</p><script type="module" src="./study.js"></script></body></html>
